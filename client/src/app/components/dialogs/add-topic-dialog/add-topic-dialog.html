<form class="form-dialog" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field>
      <mat-label for="name">Topic name</mat-label>
      <input matInput type="text" id="name" name="name" [(ngModel)]="topic.name">
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton (click)="onClose()" type="button">Sluit</button>
    <button matButton (click)="onSubmit()" type="button">Opslaan</button>
  </mat-dialog-actions>
</form>
@if (!isInputValid) {
<p class="error-message">{{ errorMessage }}</p>
}
