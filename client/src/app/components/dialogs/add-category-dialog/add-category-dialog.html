<h2 mat-dialog-title>Add a new Category</h2>
<form class="form-dialog" (ngSubmit)="onSubmit()">
  <mat-dialog-content>

    <mat-form-field>
      <mat-label for="name">Category name</mat-label>
      <input matInput type="text" id="name" name="name" [(ngModel)]="category.name">
    </mat-form-field>

    <mat-form-field>
      <mat-label for="description">Description</mat-label>
      <input matInput type="text" id="description" name="description" [(ngModel)]="category.description">
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button matButton (click)="onClose()" type="button">Close</button>
    <button matButton (click)="onSubmit()" type="button">Save</button>
  </mat-dialog-actions>
</form>
@if (!isInputValid) {
<p>{{ errorMessage }}</p>
}
