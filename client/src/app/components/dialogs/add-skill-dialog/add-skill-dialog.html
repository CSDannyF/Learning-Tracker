<h2 mat-dialog-title>Add a new Skill</h2>
<form class="form-dialog" (ngSubmit)="onSubmit()">
  <mat-dialog-content>

    <mat-form-field>
      <mat-label for="name">Skill name</mat-label>
      <input matInput type="text" id="name" name="name" [(ngModel)]="skill.name">
    </mat-form-field>

    <mat-form-field>
      <mat-label for="description">Description</mat-label>
      <input matInput type="text" id="description" name="description" [(ngModel)]="skill.description">
    </mat-form-field>

  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton (click)="onClose()" type="button">Sluit</button>
    <button matButton (click)="onSubmit()" type="button">Opslaan</button>
  </mat-dialog-actions>
</form>
@if (!isInputValid) {
<p class="error-message">{{ errorMessage }}</p>
}
