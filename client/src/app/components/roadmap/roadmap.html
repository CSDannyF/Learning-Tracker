<div class="container">
  <button matButton="filled" (click)="openNewCategoryDialog()">Add Category</button>
  <div>
    @for (category of categories; track category.id) {
    <app-category-component [category]="category" (deleteCategory)="onDeleteCategory($event)" />
    }
  </div>

  <dialog #newCategoryDialog>
    <app-add-category-dialog [existingCategories]="categories" (newCategory)="addNewCategory($event)"
      (closeDialog)="newCategoryDialog.close()">
    </app-add-category-dialog>
  </dialog>
</div>
