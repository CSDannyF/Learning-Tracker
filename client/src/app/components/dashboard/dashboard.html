  <div class="chart-container">

    <mat-card id="radar-chart">
      <apx-chart [series]="radarChartOptions.series!" [chart]="radarChartOptions.chart!"
        [title]="radarChartOptions.title!" [yaxis]="radarChartOptions.yaxis!" [xaxis]="radarChartOptions.xaxis!"
        [tooltip]="radarChartOptions.tooltip!">
      </apx-chart>
    </mat-card>

    <mat-card id="pie-chart">
      <apx-chart [series]="pieChartOptions.series!" [chart]="pieChartOptions.chart!" [title]="pieChartOptions.title!"
        [yaxis]="pieChartOptions.yaxis!" [xaxis]="pieChartOptions.xaxis!" [labels]="pieChartOptions.labels!">
      </apx-chart>
    </mat-card>


    <mat-card id="line-chart">
      <apx-chart [series]="lineChartOptions.series!" [chart]="lineChartOptions.chart!" [title]="lineChartOptions.title!"
        [yaxis]="lineChartOptions.yaxis!" [xaxis]="lineChartOptions.xaxis!" [tooltip]="lineChartOptions.tooltip!"
        [colors]="lineChartOptions.colors!">
      </apx-chart>
    </mat-card>
  </div>


  <div class="kpi-cards">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>Learning Streak</mat-card-title>
        <mat-card-subtitle>{{ learningStreak }}</mat-card-subtitle>
      </mat-card-header>
    </mat-card>
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>Total Known Skills</mat-card-title>
        <mat-card-subtitle>{{ totalKnownSkills }}</mat-card-subtitle>
      </mat-card-header>
    </mat-card>
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>Total known Topics</mat-card-title>
        <mat-card-subtitle>{{ totalKnownTopics }}</mat-card-subtitle>
      </mat-card-header>
    </mat-card>
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>Skills in Progress</mat-card-title>
        <mat-card-subtitle>{{ skillsInProgress }}</mat-card-subtitle>
      </mat-card-header>
    </mat-card>
  </div>
