<div class="category-header">
  <h2>{{ category.name }}</h2>
  <button matIconButton (click)="openNewSkillDialog()" aria-label="Add skill">
    <mat-icon class="add-skill-icon">add</mat-icon>
  </button>
</div>

<mat-tree #tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor" class="tree">
  <mat-nested-tree-node *matTreeNodeDef="let node">
    <button mat-icon-button disabled></button>
    {{ node.name }}
  </mat-nested-tree-node>
  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodeToggle
    [cdkTreeNodeTypeaheadLabel]="node.name">
    <div class="mat-tree-node">
      <button matIconButton matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
        <mat-icon class="mat-icon-rtl-mirror">
          {{ tree.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
        </mat-icon>
      </button>
      {{ node.name }}
    </div>
    <div [class.tree-invisible]="!tree.isExpanded(node)" role="group">
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>
</mat-tree>

<dialog #newSkillDialog>
  <app-add-skill-dialog [categoryId]="category.id" (newSkill)="addNewSkill($event)"
    (closeDialog)="newSkillDialog.close()"></app-add-skill-dialog>
</dialog>
